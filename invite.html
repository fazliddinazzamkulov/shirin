<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Таклифнома</title>
<!-- Шахсий таклифномалар қидирув тизимларида чиқмаслиги керак -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<!-- WhatsApp превьюси. 4-босқичда сервер ҳар бир таклифнома учун сарлавҳа ва расмни алмаштиради -->
<meta property="og:type" content="website">
<meta property="og:title" content="Таклифнома">
<meta property="og:description" content="Сизни тўйимизга таклиф этамиз">
<meta property="og:image" content="https://shirin.day/assets/saroy/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Shirin: таклифнома саҳифаси. Оқ фон, ёрқин бинафша ва пушти урғулар.
   Шрифтлар: Bad Script — асосий сўз ва исмлар (ўзбек ва қозоқ ҳарфларининг ҳаммаси бор),
   Cormorant — тантанали сарлавҳалар, Inter — оддий матн. */
:root{
  --script:"Bad Script","Segoe Script",cursive;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --paper:#FFFFFF; --ink:#1E1029; --muted:#6E6078; --line:#EEE6F2; --lilac:#F5F0FC; --pink-soft:#FDECF4;
  /* мавзу ранглари: JS шаблонга қараб алмаштиради */
  --word:#E8458B; --names:#6D28D9; --accent:#6D28D9; --accent2:#E8458B;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100svh;background:var(--paper);color:var(--ink);font:400 18px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-align:center;overflow-x:hidden}
body.locked{overflow:hidden}
[hidden]{display:none!important}
img{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px;border-radius:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:600 18px/1 var(--sans);text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px;flex:none}
.label{margin:0 0 18px;font:700 13px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--accent2)}
.word{margin:0;font:400 clamp(54px,15vw,72px)/1.05 var(--script);color:var(--word)}

/* ---------- Конверт ---------- */
.cover{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3.5vh,30px);
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));background:var(--paper);
  transition:opacity .6s ease .7s,visibility 0s linear 1.3s}
.cover.open{opacity:0;visibility:hidden}
.cover .pair{margin:-6px 0 0;font:400 clamp(26px,7.5vw,34px)/1.2 var(--script);color:var(--names)}
.env{position:relative;width:min(86vw,400px);cursor:pointer;transition:transform .8s cubic-bezier(.55,0,.8,.2) .35s,opacity .5s ease .6s}
.env .bob{position:relative;animation:bob 3.4s ease-in-out infinite}
.env .seal{position:absolute;left:50%;top:72%;width:27%;transform:translate(-50%,-50%);transition:transform .4s ease,opacity .4s ease}
@keyframes bob{50%{transform:translateY(-9px) rotate(-.6deg)}}
.cover.open .seal{transform:translate(-50%,-50%) scale(1.3);opacity:0}
.cover.open .env{transform:translateY(55vh);opacity:0}
.cover.open .word,.cover.open .pair,.cover.open .btn{opacity:0;transition:opacity .3s}

/* ---------- Асосий қисм ---------- */
main{position:relative;max-width:560px;margin:0 auto;padding-inline:max(24px,env(safe-area-inset-left)) max(24px,env(safe-area-inset-right))}
.corner{position:absolute;width:clamp(96px,30vw,150px);pointer-events:none}
.corner.tl{top:0;left:0}
.corner.tr{top:0;right:0;transform:scaleX(-1)}
.corner.bl{bottom:0;left:0;transform:scaleY(-1)}
.corner.br{bottom:0;right:0;transform:scale(-1)}

.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:clamp(72px,12vh,120px) 40px}
.hero .art{width:min(80vw,370px)}
.names{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:400 clamp(40px,11.5vw,52px)/1.3 var(--script);color:var(--names);text-wrap:balance}
.names .amp{font:400 clamp(28px,8vw,34px)/1.4 var(--script);color:var(--word)}
.hero .divider{width:min(70vw,300px);margin-top:6px}

/* Очилиш анимацияси: элементлар навбат билан чиқади */
.hero > *{opacity:0;transform:translateY(16px)}
body.go .hero > *{opacity:1;transform:none;transition:opacity .9s ease,transform .9s ease;transition-delay:calc(.55s + var(--i,0) * .16s)}

.block{padding-block:44px;opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s ease}
.block.in{opacity:1;transform:none}

/* Сурат: арка шаклида, оқ ҳошия ва ингичка чизиқ */
.photo{position:relative;margin:0 auto;width:min(80vw,340px);aspect-ratio:4/5;border-radius:999px 999px 28px 28px;overflow:hidden;
  border:6px solid #fff;outline:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:0;transform:scale(.96);transition:transform 1.2s ease}
.block.in .photo{transform:none}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;
  background:linear-gradient(170deg,var(--lilac),var(--pink-soft));color:var(--accent);font-size:16px;font-weight:500}
.photo .ph svg{width:46px;height:46px}

.guest{margin:0 0 12px;font:400 clamp(32px,9vw,40px)/1.2 var(--script);color:var(--word)}
.lead{margin:0 auto;max-width:30ch;font-size:19px;line-height:1.6;text-wrap:balance}

.date{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:32px}
.date .wd{font:700 14px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--accent2)}
.date .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:min(100%,330px)}
.date .row span{padding-block:12px;border-block:1.5px solid var(--line);font:600 14px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.date .row b{font:700 72px/.9 var(--serif);color:var(--accent);font-variant-numeric:lining-nums}
.date .time{font:600 21px/1.2 var(--sans)}

.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(100%,380px);margin:0 auto}
.cd div{display:flex;flex-direction:column;gap:6px;padding:16px 0 12px;border-radius:18px;background:var(--lilac)}
.cd b{font:700 32px/1 var(--sans);color:var(--accent);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}
.cd span{font-size:14px;color:var(--muted)}

/* Тўй дастури: вертикал чизиқ ва нуқталар */
.prog{list-style:none;margin:0 auto;padding:0;width:min(100%,360px);text-align:left;position:relative}
.prog::before{content:"";position:absolute;left:75px;top:16px;bottom:16px;width:2px;border-radius:2px;background:linear-gradient(var(--accent2),var(--accent));opacity:.3}
.prog li{display:grid;grid-template-columns:62px 28px minmax(0,1fr);align-items:start;padding:10px 0;opacity:0;transform:translateY(12px)}
.block.in .prog li{opacity:1;transform:none;transition:opacity .7s ease,transform .7s ease;transition-delay:calc(.2s + var(--k) * .15s)}
.prog time{font:700 18px/1.45 var(--sans);color:var(--accent2);font-variant-numeric:tabular-nums}
.prog .dot{width:14px;height:14px;margin:6px auto 0;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.prog span{font-size:18px;line-height:1.45}

.venue{margin:0;font:700 clamp(30px,8.5vw,36px)/1.15 var(--serif);text-wrap:balance}
.addr{margin:8px auto 24px;max-width:32ch;color:var(--muted)}
.hosts{margin:0;font:700 clamp(30px,8.5vw,36px)/1.15 var(--serif);text-wrap:balance}

.foot{position:relative;min-height:200px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 0 calc(150px + env(safe-area-inset-bottom,0px))}
.foot .corner{bottom:env(safe-area-inset-bottom,0px)}
/* Шаблон номи: майда ва ярим шаффоф, имзо каби */
.sign{font-size:12px;letter-spacing:.16em;opacity:.45}
.sign a{color:inherit;text-decoration:none}
.report{border:0;background:none;padding:10px;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ---------- Гул барглари ---------- */
.petals{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.petals i{position:absolute;top:0;width:16px;height:12px;border-radius:12px 2px 12px 2px;background:var(--c);opacity:.75;
  animation:fall var(--d) linear var(--delay) infinite;will-change:transform}
@keyframes fall{
  0%{transform:translate3d(0,-30px,0) rotate(0) scale(var(--s))}
  50%{transform:translate3d(var(--x),50vh,0) rotate(200deg) scale(var(--s))}
  100%{transform:translate3d(calc(var(--x) * -.6),105vh,0) rotate(400deg) scale(var(--s))}
}

/* ---------- Мусиқа тугмаси ---------- */
.sound{position:fixed;z-index:20;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));width:48px;height:48px;border-radius:50%;
  border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer}
.sound svg{width:22px;height:22px}
.sound .off{display:none}
.sound[aria-pressed="false"]{background:#fff;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--line)}
.sound[aria-pressed="false"] .on{display:none}
.sound[aria-pressed="false"] .off{display:block}

/* ---------- Шикоят ойнаси ---------- */
dialog{width:min(100% - 32px,420px);border:0;border-radius:24px;padding:24px;background:#fff;color:var(--ink);text-align:left}
dialog::backdrop{background:rgba(30,16,41,.5)}
dialog h2{margin:0 0 14px;font:700 30px/1.1 var(--serif)}
dialog fieldset{border:0;margin:0 0 14px;padding:0;display:flex;flex-direction:column}
dialog label.opt{display:flex;align-items:center;gap:12px;min-height:46px;font-size:17px;cursor:pointer}
dialog input[type=radio]{width:20px;height:20px;accent-color:var(--accent);margin:0}
dialog textarea{width:100%;min-height:84px;padding:12px;border:1.5px solid var(--line);border-radius:14px;font:inherit;font-size:16px;resize:vertical}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
dialog .ghost{min-height:48px;padding:0 18px;border:0;border-radius:999px;background:var(--lilac);cursor:pointer;font-weight:600}
dialog .btn{min-height:48px;font-size:16px}
dialog .msg{margin:12px 0 0;font-size:16px}

/* ---------- Топилмади ---------- */
.missing{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px}
.missing h1,.missing h2{margin:0;font:700 32px/1.1 var(--serif);color:var(--accent);text-wrap:balance}
.missing p{margin:0;color:var(--muted);max-width:32ch}
.missing p:nth-of-type(1){padding-bottom:22px;margin-bottom:12px;border-bottom:1.5px solid var(--line)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .hero > *,.block,.prog li{opacity:1;transform:none}
  .petals{display:none}
}
</style>
</head>
<body class="locked">

<!-- Конверт: очилгандан кейин йўқолади -->
<div class="cover" id="cover" hidden>
  <p class="word" data-word></p>
  <p class="pair" id="coverPair"></p>
  <div class="env" id="env">
    <div class="bob">
      <img id="envImg" alt="">
      <img class="seal" id="sealImg" alt="">

  </div>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-6 9 6v11H3Z"/><path d="M3 9l9 6 9-6"/></svg>

</div>

<main id="main" hidden>
  <img class="corner tl" data-corner alt=""><img class="corner tr" data-corner alt="">

  </section>

  <section class="block" id="photoBlock">

    <p class="guest" id="guest" hidden></p>

  </footer>
</main>

<div class="missing" id="missing" hidden></div>
<div class="petals" id="petals" aria-hidden="true"></div>

<button class="sound" id="sound" type="button" aria-pressed="true" hidden>
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>
</button>

<dialog id="report" aria-labelledby="repTitle">
  <form id="repForm" method="dialog">
    <h2 id="repTitle"></h2>
    <fieldset id="reasons"></fieldset>
    <textarea id="repComment" maxlength="500"></textarea>
    <p class="msg" id="repMsg" role="status"></p>
    <div class="row">
      <button class="ghost" type="button" id="repCancel"></button>
      <button class="btn" type="submit" id="repSend"></button>
    </div>
  </form>
</dialog>

<audio id="music" preload="none" loop></audio>

<script>
/* ===== Шаблон мавзулари: расмлар папкаси, асосий расм, мусиқа, урғу ранглари ===== */

/* ===== Демо таклифномалар (база уланмагунча). 4-босқичда маълумот PocketBase'дан келади ===== */

const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Ҳавола: shirin.day/aziz-madina → slug "aziz-madina". Синов учун: invite.html?s=nurlan-asel */
function getSlug(){
  if (qs.get("s")) return qs.get("s");
  const last = decodeURIComponent(location.pathname.replace(/\/+$/,"").split("/").pop() || "");
  // "invite" — GitHub Pages invite.html'ни .html'сиз ҳам очади
  if (last && last !== "invite" && !/\.html?$/i.test(last)) return last;
  return "aziz-madina";
}

/* Маълумотни олиш. Натижа: {state:"ok", data} | {state:"missing"} | {state:"expired"} */
async function loadInvite(slug){
  if (DEMO[slug]) return { state:"ok", data: DEMO[slug] };
  try {
    const r = await fetch(`/api/i/${encodeURIComponent(slug)}`, { headers:{ Accept:"application/json" } });
    if (r.status === 410) return { state:"expired" };
    if (r.ok) return { state:"ok", data: await r.json() };
  } catch(e) {}
  return { state:"missing" };
}

/* Меҳмон исми ?g=Анвар. Фақат матн сифатида қўйилади (textContent) */
function guestName(){
  const g = (qs.get("g") || "").replace(/[\u0000-\u001F\u007F<>]/g, "").replace(/\s+/g, " ").trim();
  return g.slice(0, 40);
}

/* Сана тадбир жойининг вақтида кўрсатилади (ISO даги +05:00), меҳмон телефонидаги минтақадан қатъи назар */
function eventParts(iso){
  const m = /([+-])(\d\d):?(\d\d)$/.exec(iso);
  const off = m ? (m[1] === "-" ? -1 : 1) * (Number(m[2]) * 60 + Number(m[3])) : 300;
  const d = new Date(new Date(iso).getTime() + off * 60000);
  const p = n => String(n).padStart(2, "0");
  return { day:d.getUTCDate(), month:d.getUTCMonth(), year:d.getUTCFullYear(), wd:d.getUTCDay(), time:`${p(d.getUTCHours())}:${p(d.getUTCMinutes())}` };
}

let L, data, slug, theme;

function render(res){
  if (res.state !== "ok"){
    (MISSING[res.state] || MISSING.missing).forEach(([t, s], i) => {
      const h = document.createElement(i ? "h2" : "h1"), p = document.createElement("p");
      h.textContent = t; p.textContent = s;
      $("#missing").append(h, p);
    });
    $("#missing").hidden = false; document.body.classList.remove("locked");
    return;
  }
  data = res.data;
  theme = THEMES[data.template] || THEMES.saroy;
  L = T[data.lang] || T["uz-Cyrl"];
  const kind = data.kind || "wedding";
  const root = document.documentElement;
  root.lang = data.lang || "uz-Cyrl";
  for (const [k, v] of Object.entries(theme.colors)) root.style.setProperty(k, v);

  const word = L.word[kind];
  document.title = `${data.name1} & ${data.name2} · ${word}`;
  document.querySelectorAll("[data-word]").forEach(el => el.textContent = word);
  document.querySelectorAll("[data-t]").forEach(el => { const v = L[el.dataset.t]; if (typeof v === "string") el.textContent = v; });

  $("#envImg").src = theme.dir + "envelope.webp";
  $("#sealImg").src = theme.dir + "seal.webp";
  $("#art").src = theme.dir + theme.art;
  $("#divider").src = theme.dir + "divider.webp";
  document.querySelectorAll("[data-corner]").forEach(el => el.src = theme.dir + "corner.webp");

  $("#coverPair").textContent = `${data.name1} & ${data.name2}`;
  $("#n1").textContent = data.name1;
  $("#n2").textContent = data.name2;

  // Сурат: мижоз юклаган бўлса — сурат; демода — бўш жой; акс ҳолда бўлим йўқ
  if (data.photo){
    const img = document.createElement("img");
    img.src = data.photo; img.alt = `${data.name1} & ${data.name2}`; img.loading = "lazy";
    $("#photo").append(img);
  } else if (data.demo){
    $("#photo").innerHTML = `<div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg><span></span></div>`;
    $("#photo span").textContent = L.photoHint;
  } else {
    $("#photoBlock").hidden = true;
  }

  const g = guestName();
  if (g){ $("#guest").textContent = L.dear(g); $("#guest").hidden = false; }
  $("#lead").textContent = data.lead || L.lead[kind];

  const e = eventParts(data.date);
  $("#wd").textContent = L.weekdays[e.wd];
  $("#mon").textContent = L.months[e.month];
  $("#day").textContent = e.day;
  $("#yr").textContent = e.year;
  $("#time").textContent = L.at(e.time);

  $("#cdLabel").textContent = L.until[kind];
  $("#cd").innerHTML = L.units.map(() => `<div><b>0</b><span></span></div>`).join("");
  $("#cd").querySelectorAll("span").forEach((s, i) => s.textContent = L.units[i]);
  tick(); setInterval(tick, 1000);

  // Тўй дастури
  const prog = Array.isArray(data.program) ? data.program.filter(x => x && x.title) : [];
  if (prog.length){
    $("#progLabel").textContent = L.program[kind];
    prog.forEach((x, k) => {
      const li = document.createElement("li"); li.style.setProperty("--k", k);
      const t = document.createElement("time"); t.textContent = x.time || "";
      const dot = document.createElement("i"); dot.className = "dot";
      const s = document.createElement("span"); s.textContent = x.title;
      li.append(t, dot, s); $("#prog").append(li);
    });
  } else $("#progBlock").hidden = true;

  $("#venue").textContent = data.venue || "";
  $("#addr").textContent = data.address || "";
  if (data.map) $("#mapBtn").href = data.map; else $("#mapBtn").hidden = true;
  if (!data.venue && !data.address) $("#venueBlock").hidden = true;

  if (data.hosts) $("#hosts").textContent = data.hosts; else $("#hostsBlock").hidden = true;

  $("#tplName").textContent = theme.name;
  $("#music").src = `assets/music/${data.music || theme.music}.mp3`;
  $("#sound").setAttribute("aria-label", L.soundOff);

  $("#main").hidden = false;
  $("#cover").hidden = false;
  revealOnScroll();
}

/* Тескари санаш */
function tick(){
  const ms = new Date(data.date).getTime() - Date.now();
  if (ms <= 0){ $("#cdBlock").hidden = true; return; }
  const v = [Math.floor(ms / 864e5), Math.floor(ms / 36e5) % 24, Math.floor(ms / 6e4) % 60, Math.floor(ms / 1e3) % 60];
  $("#cd").querySelectorAll("b").forEach((b, i) => { const s = String(v[i]); if (b.textContent !== s) b.textContent = s; });
}

/* Бўлимлар экранга келганда аста чиқади */
function revealOnScroll(){
  const blocks = document.querySelectorAll(".block");
  if (!("IntersectionObserver" in window)) { blocks.forEach(b => b.classList.add("in")); return; }
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: .12 });
  blocks.forEach(b => io.observe(b));
}

/* Гул барглари: очилгандан кейин секин тушиб туради */
function petals(n){
  if (calm) return;
  const box = $("#petals"), cs = theme.petals;
  for (let i = 0; i < n; i++){
    const p = document.createElement("i");
    p.style.left = (Math.random() * 100).toFixed(1) + "%";
    p.style.setProperty("--c", cs[i % cs.length]);
    p.style.setProperty("--d", (10 + Math.random() * 8).toFixed(1) + "s");
    p.style.setProperty("--delay", (Math.random() * 9).toFixed(1) + "s");
    p.style.setProperty("--s", (0.6 + Math.random() * 0.7).toFixed(2));
    p.style.setProperty("--x", (Math.random() * 90 - 45).toFixed(0) + "px");
    box.append(p);
  }
}

/* Ўз-ўзидан секин пастга айланиш. Меҳмон экранга теккан заҳоти тўхтайди */
function autoScroll(){
  if (calm) return;
  const SPEED = 34; // пиксел/сония
  let raf = 0, last = 0, acc = 0;
  const evs = ["touchstart", "wheel", "keydown", "mousedown"];
  const stop = () => { cancelAnimationFrame(raf); evs.forEach(e => removeEventListener(e, stop)); };
  evs.forEach(e => addEventListener(e, stop, { passive:true }));
  const step = t => {
    if (last){ acc += SPEED * Math.min(64, t - last) / 1000; }
    last = t;
    const px = Math.floor(acc);
    if (px >= 1){ acc -= px; window.scrollBy(0, px); }
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) return stop();
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

/* ===== Конвертни очиш ва мусиқа ===== */
const audio = $("#music");
let opened = false, resumeOnShow = false;

function fadeIn(){
  // iOS'да volume ўзгармайди — у ерда мусиқа дарров тўлиқ овозда бошланади
  audio.volume = 0;
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 1800); audio.volume = k; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function setSound(on){
  $("#sound").setAttribute("aria-pressed", on);
  $("#sound").setAttribute("aria-label", on ? L.soundOff : L.soundOn);
}
function playMusic(){
  const p = audio.play();
  if (p && p.catch) p.catch(() => setSound(false));
  setSound(true);
}
function openInvite(){
  if (opened) return; opened = true;
  fadeIn(); playMusic();
  $("#cover").classList.add("open");
  document.body.classList.remove("locked");
  document.body.classList.add("go");
  $("#sound").hidden = false;
  setTimeout(() => $("#cover").remove(), 1400);
  setTimeout(() => petals(16), 600);
  setTimeout(autoScroll, 4200); // аввал биринчи экран кўрсатилади
}
$("#openBtn").addEventListener("click", openInvite);
$("#env").addEventListener("click", openInvite);

$("#sound").addEventListener("click", () => {
  if (audio.paused){ playMusic(); } else { audio.pause(); setSound(false); }
});
// Меҳмон бошқа иловага ўтса мусиқа тўхтайди, қайтса давом этади
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ if (!audio.paused){ audio.pause(); resumeOnShow = true; } }
  else if (resumeOnShow){ resumeOnShow = false; playMusic(); }
});

/* ===== Шикоят: 4-босқичда PocketBase "reports" тўпламига тушади, админкада кўринади ===== */
const dlg = $("#report");
const REASON_CODES = ["wrong_info", "offensive", "fraud", "other"]; // L.reasons билан бир хил тартибда
$("#reportBtn").addEventListener("click", () => {
  $("#repTitle").textContent = L.repTitle;
  $("#reasons").innerHTML = "";
  L.reasons.forEach((r, i) => {
    const lab = document.createElement("label"); lab.className = "opt";
    const inp = document.createElement("input"); inp.type = "radio"; inp.name = "reason"; inp.value = String(i);
    lab.append(inp, document.createTextNode(r));
    $("#reasons").append(lab);
  });
  $("#repComment").placeholder = L.comment; $("#repComment").value = "";
  $("#repCancel").textContent = L.cancel; $("#repSend").textContent = L.send; $("#repSend").hidden = false;
  $("#repMsg").textContent = "";
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
});
$("#repCancel").addEventListener("click", () => dlg.close ? dlg.close() : dlg.removeAttribute("open"));
$("#repForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const picked = $("#repForm").querySelector("input[name=reason]:checked");
  if (!picked){ $("#repMsg").textContent = L.pick; return; }
  $("#repSend").disabled = true;
  try {
    const r = await fetch("/api/collections/reports/records", {
      method: "POST", headers: { "Content-Type":"application/json" },
      body: JSON.stringify({ invite: slug, reason: REASON_CODES[picked.value], comment: $("#repComment").value.trim().slice(0, 500) })
    });
    if (!r.ok) throw new Error(r.status);
    $("#repMsg").textContent = L.thanks; $("#repSend").hidden = true; $("#repCancel").textContent = "OK";
  } catch(e) {
    $("#repMsg").textContent = L.fail;
  } finally { $("#repSend").disabled = false; }
});

slug = getSlug();
loadInvite(slug).then(render);
